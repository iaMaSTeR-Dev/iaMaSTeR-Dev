
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
  <title id="title">MAST IDE — iaMaSTeR Developer Workspace</title>
  <desc id="desc">A dark code editor interface introducing iaMaSTeR and featuring the Senora and FileStreamBot projects.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191e29"/>
      <stop offset="100%" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78a9ff"/>
      <stop offset="100%" stop-color="#b69cff"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="1" y="1" width="998" height="368" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#windowClip)">
    <!-- Window -->
    <rect width="1000" height="370" fill="url(#background)"/>
    <rect x="1" y="1" width="998" height="368" rx="12" fill="none" stroke="#343b4a"/>

    <!-- Title bar -->
    <rect width="1000" height="44" fill="#202530"/>
    <circle cx="22" cy="22" r="5" fill="#ff6259"/>
    <circle cx="40" cy="22" r="5" fill="#ffc04d"/>
    <circle cx="58" cy="22" r="5" fill="#35c96f"/>
    <text x="500" y="26" fill="#aab5c7" font-family="Consolas, monospace" font-size="12" text-anchor="middle">MAST//IDE — iaMaSTeR — Workspace</text>
    <text x="976" y="26" fill="#758197" font-family="Consolas, monospace" font-size="10" text-anchor="end">●</text>

    <!-- Activity bar -->
    <rect x="0" y="44" width="49" height="288" fill="#191e27"/>
    <rect x="0" y="59" width="3" height="26" fill="#82aaff"/>
    <g fill="none" stroke="#8793a7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="64" width="17" height="16" rx="2"/>
      <circle cx="24" cy="112" r="8"/>
      <path d="M15 158 L24 149 L33 158 L24 167 Z"/>
      <path d="M15 202 H33 M15 208 H33 M15 214 H27"/>
      <circle cx="24" cy="257" r="8"/>
      <path d="M24 252 V262 M19 257 H29"/>
    </g>

    <!-- Explorer -->
    <rect x="49" y="44" width="205" height="288" fill="#1c222d"/>
    <text x="66" y="69" fill="#a3adbd" font-family="Consolas, monospace" font-size="10" letter-spacing="1.4">EXPLORER</text>
    <text x="66" y="101" fill="#dce3ef" font-family="Consolas, monospace" font-size="12">⌄  iaMaSTeR</text>

    <text x="82" y="132" fill="#83aaff" font-family="Consolas, monospace" font-size="11">⌄  projects</text>
    <circle cx="96" cy="156" r="3" fill="#b69cff"/>
    <text x="108" y="160" fill="#d9c7a2" font-family="Consolas, monospace" font-size="11">Senora</text>
    <circle cx="96" cy="183" r="3" fill="#83c99a"/>
    <text x="108" y="187" fill="#d9c7a2" font-family="Consolas, monospace" font-size="11">FileStreamBot</text>

    <text x="82" y="226" fill="#83aaff" font-family="Consolas, monospace" font-size="11">⌄  profile</text>
    <text x="101" y="252" fill="#9bc88e" font-family="Consolas, monospace" font-size="11">◈ about.ts</text>
    <text x="101" y="278" fill="#9bc88e" font-family="Consolas, monospace" font-size="11">◈ README.md</text>
    <text x="66" y="316" fill="#657187" font-family="Consolas, monospace" font-size="9">WORKSPACE / 01</text>

    <!-- Editor tabs -->
    <rect x="254" y="44" width="746" height="36" fill="#1b202a"/>
    <rect x="254" y="44" width="133" height="36" fill="#252c38"/>
    <rect x="254" y="77" width="133" height="2" fill="url(#accent)"/>
    <text x="270" y="66" fill="#c9d8ee" font-family="Consolas, monospace" font-size="11">◈ about.ts</text>
    <text x="407" y="66" fill="#7d899c" font-family="Consolas, monospace" font-size="11">README.md</text>

    <!-- Editor canvas -->
    <rect x="254" y="80" width="746" height="252" fill="#151922"/>
    <g font-family="Consolas, monospace" font-size="13">
      <g fill="#586579" text-anchor="end">
        <text x="291" y="111">1</text>
        <text x="291" y="137">2</text>
        <text x="291" y="163">3</text>
        <text x="291" y="189">4</text>
        <text x="291" y="215">5</text>
        <text x="291" y="241">6</text>
        <text x="291" y="267">7</text>
        <text x="291" y="293">8</text>
      </g>

      <text x="310" y="111" fill="#c792ea">export const <tspan fill="#82aaff">developer</tspan> = {</text>
      <text x="310" y="137" fill="#9cdcfe">  role: <tspan fill="#ce9178">"Independent Software Developer"</tspan>,</text>
      <text x="310" y="163" fill="#9cdcfe">  handle: <tspan fill="#ce9178">"iaMaSTeR"</tspan>,</text>
      <text x="310" y="189" fill="#9cdcfe">  projects: [</text>
      <text x="310" y="215" fill="#ce9178">    "Senora",</text>
      <text x="310" y="241" fill="#ce9178">    "FileStreamBot"</text>
      <text x="310" y="267" fill="#9cdcfe">  ]</text>
      <text x="310" y="293" fill="#c792ea">};</text>
    </g>

    <!-- Bottom terminal -->
    <rect x="254" y="332" width="746" height="38" fill="#202530"/>
    <line x1="254" y1="332" x2="1000" y2="332" stroke="#343b4a"/>
    <text x="271" y="355" fill="#a4afc1" font-family="Consolas, monospace" font-size="10" letter-spacing="1">TERMINAL</text>
    <text x="380" y="355" fill="#86c995" font-family="Consolas, monospace" font-size="11">$ build --with-purpose</text>
    <text x="977" y="355" fill="#82aaff" font-family="Consolas, monospace" font-size="10" text-anchor="end">MAST//IDE</text>
  </g>
</svg>
